# The desktop program (V5, Electron, desktop/):
# 1. "server": the desktop program's scan reader (desktop/server.js) with the workspace (tests/workspace/test_desktop_server.py,
#    Linux, Chromium).
# 2. "installer": builds the Windows installer; on a real Windows machine: the unpacked program in its test mode, then
#    tests/windows/installer-checks.ps1 (silent install into a chosen folder, test mode, uninstall; then the installer's pages clicked
#    through: install location, the Shortcuts page, Desktop unticked -> Start menu only). The installer is kept as a download of this
#    run ("Book-Compare-Setup") for 30 days, and when its version (desktop/package.json) is new it is published on the Releases page
#    (https://github.com/PeerPioneer/Book-Compare/releases/latest), which is where the website's link and the program's
#    "new version" notice point.
name: Desktop program
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'tests/workspace/test_desktop_server.py'
      - 'tests/windows/installer-checks.ps1'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the browser used by the test
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Scan reader and workspace
        env:
          BOOKCOMPARE_BROWSERS: chromium
        run: python tests/workspace/test_desktop_server.py

  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write          # to publish a new version on the Releases page
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build the installer
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run dist
      - name: The unpacked program starts (test mode)
        shell: powershell
        working-directory: desktop
        run: |
          $exe = Get-ChildItem dist\win-unpacked -Filter 'Book Compare.exe' | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--smoke-test', "$env:TEMP\smoke1.json" -PassThru -Wait
          Get-Content "$env:TEMP\smoke1.json"
          if ($p.ExitCode -ne 0) { throw "test mode failed (exit $($p.ExitCode))" }
      - name: Installer checks (silent install into a chosen folder; the pages clicked through)
        shell: powershell
        run: |
          $setup = Get-ChildItem desktop\dist -Filter 'Book-Compare-Setup-*.exe' | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\installer-checks.ps1 -Setup $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw 'installer checks failed' }
      - name: The update description for the one-click update is there
        shell: bash
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          cat desktop/dist/latest.yml
          test -f desktop/dist/latest.yml && grep -q "version: $v" desktop/dist/latest.yml && grep -q "sha512:" desktop/dist/latest.yml
          test -f desktop/dist/win-unpacked/resources/app-update.yml && cat desktop/dist/win-unpacked/resources/app-update.yml
          grep -q "provider: generic" desktop/dist/win-unpacked/resources/app-update.yml && grep -q "raw.githubusercontent.com/PeerPioneer/Book-Compare/update/" desktop/dist/win-unpacked/resources/app-update.yml
      - uses: actions/upload-artifact@v5
        with:
          name: Book-Compare-Setup
          path: desktop/dist/Book-Compare-Setup-*.exe
          retention-days: 30
          if-no-files-found: error
      - name: Publish on the Releases page (only a new version)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "v$v is already on the Releases page"; exit 0; fi
          sed "s/VERSION/$v/g" desktop/RELEASE-NOTES.md > notes.md
          grep -q "Book-Compare-Setup-$v.exe" desktop/dist/latest.yml
          # 0.13.0 (owner): only the installer is on the Releases page
          gh release create "v$v" "desktop/dist/Book-Compare-Setup-$v.exe" -R "$GITHUB_REPOSITORY" --title "Book Compare $v" --notes-file notes.md --target "$GITHUB_SHA" --latest
          # The description the one-click update reads (latest.yml: version, size and SHA-512 of the installer) lies on the branch
          # "update" instead (desktop/package.json: provider "generic"), pointing at the installer on the Releases page. (Without the
          # blockmap next to the installer the update downloads the whole installer, about 125 MB.)
          mkdir upd && cd upd
          sed -E "s#^(path: |  - url: )(Book-Compare-Setup-$v\.exe)#\1https://github.com/$GITHUB_REPOSITORY/releases/download/v$v/\2#" ../desktop/dist/latest.yml > latest.yml
          cat latest.yml
          grep -q "releases/download/v$v/Book-Compare-Setup-$v.exe" latest.yml
          printf 'Read by the one-click update of the Book Compare desktop program (desktop/package.json, publish: generic). Written by .github/workflows/desktop.yml for each new version.\n' > README.md
          git init -q && git checkout -q -b update && git add latest.yml README.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Update description for version $v"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" update
