# 1. "helper": tests the Book Compare helper on a real Windows machine (Windows PowerShell 5.1 and a Windows folder window),
#    which is the one thing that can not be tested on the machine where the code is written.
# 2. "quick": the workspace and library-folder tests (Chromium) and the test of the Photoshop script.
# 3. "publish": ONLY when both passed (and only for main): puts the folder "app" on the website (GitHub Pages).
#    A failed test therefore never reaches the website; the last good version stays online.
#    The website can also be refreshed by hand: Actions > this workflow > Run workflow (the tests run first).
name: Tests, then website
on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'app/**'
      - 'tests/**'
      - 'tools/**'
      - '*.bat'
      - '.github/workflows/windows-test.yml'
  workflow_dispatch:
jobs:
  helper:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Windows pieces (folder window, shortcuts, start file, icon near the clock)
        id: checks
        shell: powershell
        timeout-minutes: 6
        continue-on-error: true
        run: ./tests/windows/windows-checks.ps1
      - name: Install the browsers used by the tests
        run: |
          pip install playwright pillow
          python -m playwright install chromium firefox
      - name: Helper and workspace in Chromium and Firefox (Windows PowerShell 5.1)
        shell: cmd
        timeout-minutes: 12
        env:
          PWSH: powershell
        run: |
          python tests\workspace\test_helper.py > "%TEMP%\bc-helper-test.txt" 2>&1
          set RC=%ERRORLEVEL%
          type "%TEMP%\bc-helper-test.txt"
          exit /b %RC%
      - name: Compare tab with the real alignment (Windows PowerShell 5.1)
        if: always()
        shell: cmd
        timeout-minutes: 15
        env:
          PWSH: powershell
        run: |
          python tests\workspace\test_compare_tab.py > "%TEMP%\bc-compare-test.txt" 2>&1
          set RC=%ERRORLEVEL%
          type "%TEMP%\bc-compare-test.txt"
          exit /b %RC%
      - name: Windows checks result (the text of both test runs, shown as a note on this job)
        if: always()
        shell: powershell
        run: |
          $text = ''
          foreach ($f in @('bc-progress.txt', 'bc-helper-test.txt', 'bc-compare-test.txt')) {
            $p = Join-Path $env:TEMP $f
            $text += "=== $f`r`n"
            if (Test-Path $p) { $c = Get-Content $p -Raw -Encoding UTF8; if ($c.Length -gt 6000) { $c = '...' + $c.Substring($c.Length - 6000) }; $text += $c } else { $text += "(not written)" }
            $text += "`r`n"
          }
          $text = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Host "::notice title=Windows test output::$text"
      - name: Fail the job if the Windows pieces failed
        if: steps.checks.outcome == 'failure'
        shell: cmd
        run: exit /b 1

  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the browser and helpers used by the tests
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          npm install --no-save acorn
      - name: Visualization-mode, workspace and library-folder tests (Chromium)
        id: ws
        run: |
          python -m http.server 8765 --directory app > /dev/null 2>&1 &
          sleep 2
          python tests/workspace/test_modes.py > /tmp/bc-modes-test.txt 2>&1 && python tests/workspace/test_workspace.py > /tmp/bc-workspace-test.txt 2>&1 && python tests/workspace/test_roots.py > /tmp/bc-roots-test.txt 2>&1
      - name: Photoshop script (with a stand-in for Photoshop)
        if: always()
        run: node tests/photoshop/test_split_script.js
      - name: Test output (shown as a note on this job)
        if: always()
        run: |
          text=""
          for f in /tmp/bc-modes-test.txt /tmp/bc-workspace-test.txt /tmp/bc-roots-test.txt; do
            text="$text=== $f"$'\n'
            if [ -f "$f" ]; then text="$text$(tail -c 5000 "$f")"; else text="$text(not written)"; fi
            text="$text"$'\n'
          done
          text="${text//'%'/'%25'}"; text="${text//$'\r'/'%0D'}"; text="${text//$'\n'/'%0A'}"
          echo "::notice title=Linux test output::$text"

  publish:
    needs: [helper, quick]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v5
