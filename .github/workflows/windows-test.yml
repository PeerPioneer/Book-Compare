# 1. "windows": on a real Windows machine (Windows paths, upper/lower case, locked files): the desktop program's scan reader
#    (desktop/server.js) with the workspace in Chromium and Firefox, and the Compare tab with the real alignment.
# 2. "quick": the workspace and library-folder tests (Chromium).
# 3. "publish": ONLY when "windows" and "quick" passed (and only for main): puts the folder "app" on the website (GitHub Pages).
#    A failed test therefore never reaches the website; the last good version stays online.
#    The website can also be refreshed by hand: Actions > this workflow > Run workflow (the tests run first).
name: Tests, then website
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'desktop/server.js'
      - 'tests/workspace/**'
      - 'research/js/**'
      - '.github/workflows/windows-test.yml'
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install the browsers used by the tests
        run: |
          pip install playwright pillow
          python -m playwright install chromium firefox
      - name: Scan reader and workspace in Chromium and Firefox
        shell: cmd
        timeout-minutes: 12
        run: |
          python tests\workspace\test_desktop_server.py > "%TEMP%\bc-server-test.txt" 2>&1
          set RC=%ERRORLEVEL%
          type "%TEMP%\bc-server-test.txt"
          exit /b %RC%
      - name: Compare tab with the real alignment
        if: always()
        shell: cmd
        timeout-minutes: 15
        run: |
          python tests\workspace\test_compare_tab.py > "%TEMP%\bc-compare-test.txt" 2>&1
          set RC=%ERRORLEVEL%
          type "%TEMP%\bc-compare-test.txt"
          exit /b %RC%
      - name: Reference copy, background alignment and stored alignments
        if: always()
        shell: cmd
        timeout-minutes: 15
        run: |
          python tests\workspace\test_background.py > "%TEMP%\bc-background-test.txt" 2>&1
          set RC=%ERRORLEVEL%
          type "%TEMP%\bc-background-test.txt"
          exit /b %RC%
      - name: Windows test output (shown as a note on this job)
        if: always()
        shell: powershell
        run: |
          $text = ''
          foreach ($f in @('bc-server-test.txt', 'bc-compare-test.txt', 'bc-background-test.txt')) {
            $p = Join-Path $env:TEMP $f
            $text += "=== $f`r`n"
            if (Test-Path $p) { $c = Get-Content $p -Raw -Encoding UTF8; if ($c.Length -gt 6000) { $c = '...' + $c.Substring($c.Length - 6000) }; $text += $c } else { $text += "(not written)" }
            $text += "`r`n"
          }
          $text = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Host "::notice title=Windows test output::$text"

  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the browser and helpers used by the tests
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          npm install --no-save acorn
      - name: Visualization-mode, workspace and library-folder tests (Chromium)
        id: ws
        run: |
          python -m http.server 8765 --directory app > /dev/null 2>&1 &
          sleep 2
          rc=0
          (node research/js/build_worker.js --check && node research/js/test_stored.js && node research/js/test_quad.js && node tests/unit/test_project_pack.js && python tests/workspace/test_align_worker.py) > /tmp/bc-worker-test.txt 2>&1 || rc=1
          (python tests/workspace/test_modes.py > /tmp/bc-modes-test.txt 2>&1 && python tests/workspace/test_workspace.py > /tmp/bc-workspace-test.txt 2>&1 && python tests/workspace/test_roots.py > /tmp/bc-roots-test.txt 2>&1) || rc=1
          python tests/workspace/test_desktop_links.py > /tmp/bc-desktop-links-test.txt 2>&1 || rc=1
          exit $rc
      - name: Test output (shown as a note on this job)
        if: always()
        run: |
          text=""
          for f in /tmp/bc-worker-test.txt /tmp/bc-modes-test.txt /tmp/bc-workspace-test.txt /tmp/bc-roots-test.txt /tmp/bc-desktop-links-test.txt; do
            text="$text=== $f"$'\n'
            if [ -f "$f" ]; then text="$text$(tail -c 5000 "$f")"; else text="$text(not written)"; fi
            text="$text"$'\n'
          done
          text="${text//'%'/'%25'}"; text="${text//$'\r'/'%0D'}"; text="${text//$'\n'/'%0A'}"
          echo "::notice title=Linux test output::$text"

  # 4. "longrun" (item 38): a whole book of 90 pages aligned in the background on Windows. It does not hold back the website.
  longrun:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      BOOKCOMPARE_BROWSERS: chromium
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install the browser
        run: |
          pip install playwright pillow
          python -m playwright install chromium
      - name: A whole book in the background
        shell: cmd
        timeout-minutes: 35
        run: python tests\workspace\test_longrun.py
  publish:
    needs: [windows, quick]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v5
